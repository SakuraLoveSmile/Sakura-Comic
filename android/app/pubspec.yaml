name: comic_app
description: "Komga media library client — Android shell (Flutter UI on top of Rust Core)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Must match flutter_rust_bridge_codegen exactly (forceSameCodegenVersion
  # check at runtime). Regenerate with scripts/frb_wire.sh.
  flutter_rust_bridge: 2.13.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
