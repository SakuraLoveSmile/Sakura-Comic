name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v0.1.0). Empty = use pubspec version."
        required: false
        default: ""
      draft:
        description: "Create as draft release"
        required: false
        default: false
        type: boolean
      release_target:
        description: "Which platform jobs to run. Tag pushes always run all jobs regardless."
        required: false
        default: "all"
        type: choice
        options:
          - all
          - android

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned to the dev-machine toolchain — see ci.yml for why.
  FLUTTER_VERSION: "3.41.3"
  # 反馈服务接入：正式包必须携带。这不是密钥——值经 dart-define 编进产物，
  # 校验步骤保证两端一致且非空。
  FEEDBACK_API_BASE: "https://feedback.xn--fhqths51enha.cn"
  FEEDBACK_APP_ID: "comic"

jobs:
  # Android — Flutter shell on top of Rust core, signed with the self-signed
  # keystore that scripts/android_release_key.sh creates locally. The keystore
  # itself never lands in git; CI recreates it from four repository secrets.
  #
  # Required secrets (Settings → Secrets and variables → Actions):
  #   ANDROID_KEYSTORE_BASE64  — `base64 -w0 android/app/android/keystore/comic-release.jks`
  #                              (macOS: `base64 -i android/app/android/keystore/comic-release.jks | tr -d '\n'`)
  #   ANDROID_KEYSTORE_PASSWORD — storePassword from android/app/android/key.properties
  #   ANDROID_KEY_PASSWORD      — keyPassword  from the same file (same value by default)
  #   ANDROID_KEY_ALIAS         — keyAlias      (default: comic-release)
  #
  # Generate locally once: `bash scripts/android_release_key.sh`
  # Keep the .jks + key.properties for the lifetime of dev.sakurasep.comic.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail
          PUB_FULL=$(grep '^version:' android/app/pubspec.yaml | awk '{print $2}')
          PUB_VERSION=$(echo "$PUB_FULL" | cut -d'+' -f1)
          PUB_BUILD=$(echo "$PUB_FULL" | cut -s -d'+' -f2)
          PUB_BUILD="${PUB_BUILD:-1}"
          if [[ -n "${{ inputs.version }}" ]]; then
            REQ_TAG="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REQ_TAG="${GITHUB_REF#refs/tags/}"
          else
            REQ_TAG="v$PUB_VERSION"
          fi
          CLEAN_TAG="${REQ_TAG#v}"
          if [[ "$CLEAN_TAG" != "$PUB_VERSION" ]]; then
            echo "::error::Release tag '$REQ_TAG' does not match pubspec.yaml version '$PUB_VERSION'!" >&2
            exit 1
          fi
          echo "tag=$REQ_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PUB_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$PUB_BUILD" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Install Android targets + cargo-ndk + flutter_rust_bridge_codegen
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          # cargo-ndk 4.x needs rustc 1.86 and 3.5.5+ are yanked; the pinned
          # toolchain is 1.85.0, so the newest installable release is 3.5.4.
          cargo install cargo-ndk --locked --version 3.5.4 || true
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore keystore + key.properties from secrets
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${B64:-}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — add the four ANDROID_* secrets (see job header)."
            exit 1
          fi
          mkdir -p android/app/android/keystore
          echo "$B64" | base64 -d > android/app/android/keystore/comic-release.jks
          ALIAS="${KEY_ALIAS:-comic-release}"
          cat > android/app/android/key.properties <<EOF
          storeFile=keystore/comic-release.jks
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KEY_PASS
          EOF
          chmod 600 android/app/android/key.properties
          echo "keystore restored: $(ls -lh android/app/android/keystore/comic-release.jks)"

      - name: Wire Rust core (FRB codegen + 3-ABI .so)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export JAVA_HOME="${JAVA_HOME:-}"
          bash scripts/frb_wire.sh

      - name: Validate feedback config (release must ship it)
        run: |
          set -euo pipefail
          if [[ -z "${FEEDBACK_API_BASE:-}" || -z "${FEEDBACK_APP_ID:-}" ]]; then
            echo "::error::反馈配置缺失——正式包必须携带反馈接入。请在 workflow env 中设置 FEEDBACK_API_BASE 与 FEEDBACK_APP_ID。" >&2
            exit 1
          fi
          if [[ ! "$FEEDBACK_API_BASE" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error::FEEDBACK_API_BASE 非法（'$FEEDBACK_API_BASE'）——必须是 http(s) 地址。" >&2
            exit 1
          fi
          echo "feedback config ok: base=$FEEDBACK_API_BASE appId=$FEEDBACK_APP_ID"

      - name: Build Android APKs (signed, split-per-abi) + AAB
        working-directory: android/app
        run: |
          DEFINES="--dart-define=FEEDBACK_API_BASE=$FEEDBACK_API_BASE --dart-define=FEEDBACK_APP_ID=$FEEDBACK_APP_ID"
          flutter build apk --release --split-per-abi --build-name="${{ steps.version.outputs.version }}" --build-number="${{ steps.version.outputs.build_number }}" $DEFINES --verbose
          flutter build appbundle --release --build-name="${{ steps.version.outputs.version }}" --build-number="${{ steps.version.outputs.build_number }}" $DEFINES --verbose
          ls -lh build/app/outputs/flutter-apk/*.apk
          ls -lh build/app/outputs/bundle/release/*.aab
          # quick signature sanity
          "$ANDROID_HOME/build-tools/"*/apksigner verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | head -4

      - name: Checksum + upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.version.outputs.tag }}
          path: |
            android/app/build/app/outputs/flutter-apk/*-release.apk
            android/app/build/app/outputs/bundle/release/*.aab

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: |
            android/app/build/app/outputs/flutter-apk/*-release.apk
            android/app/build/app/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Apple — KomgaKit (SwiftPM) + ComicApp (iOS + macOS).
  # tvOS / visionOS shells exist but are excluded from this Release pipeline
  # per current scope. XcodeGen regenerates the .xcodeproj (gitignored).
  # Builds are unsigned (CODE_SIGNING_ALLOWED=NO) for a portable GitHub
  # artifact; replacing with a real identity is one setting:
  #   CODE_SIGN_IDENTITY, PROVISIONING_PROFILE_SPECIFIER, DEVELOPMENT_TEAM
  # and `CODE_SIGNING_ALLOWED=YES`. Bundle IDs are still com.example.comic.* —
  # change apple/ComicApp/project.yml bundleIdPrefix to dev.sakurasep.comic
  # before an App Store / TestFlight submission.
  apple:
    # 手动发布且显式选 android 时才跳过；tag push 保持原有全平台行为。
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_target != 'android' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail
          PUB_FULL=$(grep '^version:' android/app/pubspec.yaml | awk '{print $2}')
          PUB_VERSION=$(echo "$PUB_FULL" | cut -d'+' -f1)
          PUB_BUILD=$(echo "$PUB_FULL" | cut -s -d'+' -f2)
          PUB_BUILD="${PUB_BUILD:-1}"
          if [[ -n "${{ inputs.version }}" ]]; then
            REQ_TAG="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            REQ_TAG="${GITHUB_REF#refs/tags/}"
          else
            REQ_TAG="v$PUB_VERSION"
          fi
          CLEAN_TAG="${REQ_TAG#v}"
          if [[ "$CLEAN_TAG" != "$PUB_VERSION" ]]; then
            echo "::error::Release tag '$REQ_TAG' does not match pubspec.yaml version '$PUB_VERSION'!" >&2
            exit 1
          fi
          echo "tag=$REQ_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PUB_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$PUB_BUILD" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: SwiftPM — KomgaKit build + test
        working-directory: apple/KomgaKit
        run: |
          swift build -c release
          swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple/ComicApp
        run: xcodegen generate

      - name: Build iOS (Release, unsigned)
        working-directory: apple/ComicApp
        run: |
          set -o pipefail
          xcodebuild -project ComicApp.xcodeproj \
            -scheme ComicApp_iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            -derivedDataPath build \
            build | xcpretty

      - name: Build macOS (Release, unsigned)
        working-directory: apple/ComicApp
        run: |
          set -o pipefail
          xcodebuild -project ComicApp.xcodeproj \
            -scheme ComicApp_macOS \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_number }}" \
            -derivedDataPath build \
            build | xcpretty

      - name: Zip .app bundles and verify artifacts
        working-directory: apple/ComicApp
        run: |
          set -euo pipefail
          mkdir -p dist
          APPS=$(find build/Build/Products -name "*.app" -maxdepth 4 2>/dev/null)
          if [ -z "$APPS" ]; then
            echo "::error::No .app bundles found! Build failed to produce targets." >&2
            exit 1
          fi
          IOS_APP=0
          MAC_APP=0
          for app in $APPS; do
            name=$(basename "$app" .app)
            cfg=$(basename $(dirname "$app"))
            zipname="dist/${name}-${cfg}-${{ steps.version.outputs.tag }}.app.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$zipname"
            ls -lh "$zipname"
            if [[ "$name" == *"iOS"* ]]; then IOS_APP=1; fi
            if [[ "$name" == *"macOS"* ]] || [[ "$name" == *"MacOS"* ]]; then MAC_APP=1; fi
          done
          if [ "$IOS_APP" -ne 1 ] || [ "$MAC_APP" -ne 1 ]; then
            echo "::error::Missing required .app bundles: iOS=$IOS_APP macOS=$MAC_APP" >&2
            exit 1
          fi

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ steps.version.outputs.tag }}
          path: apple/ComicApp/dist/*.zip
          if-no-files-found: error

      - name: Publish Apple zips to the same Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: apple/ComicApp/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
